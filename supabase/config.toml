# Configuração mínima para Supabase CLI (funções + db query --linked).
# Depois de `npm run supabase:link`, o CLI preenche o project ref aqui.

[api]
enabled = true

[functions.register-free]
verify_jwt = false

# Asaas chama o webhook sem JWT do Supabase — a autenticacao e feita pelo
# token proprio (header asaas-access-token, validado dentro da funcao).
[functions.asaas-webhook]
verify_jwt = false
