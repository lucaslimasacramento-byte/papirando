<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
  </defs>

  <!-- Fundo papel -->
  <rect width="1200" height="630" fill="#f3efe5"/>

  <!-- Linhas sutis de caderno -->
  <g stroke="#14110d" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
  </g>

  <!-- Faixa de acento à esquerda -->
  <rect x="0" y="0" width="14" height="630" fill="url(#accent)"/>

  <!-- Marca: tile com canto dobrado -->
  <g transform="translate(96, 96)">
    <rect width="72" height="72" rx="14" fill="#14110d"/>
    <path d="M52 0 L72 20 L52 20 Z" fill="#f4d04e"/>
    <text x="36" y="50" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="42" font-weight="600" fill="#f3efe5" text-anchor="middle">P</text>
  </g>
  <text x="188" y="146" font-family="'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5" fill="#14110d">Papirando</text>

  <!-- Eyebrow -->
  <text x="98" y="266" font-family="'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif" font-size="20" font-weight="700" letter-spacing="6" fill="#1d4ed8">O ESTÚDIO DE ESTUDOS COM IA</text>

  <!-- Título editorial -->
  <text x="94" y="356" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="76" font-weight="500" fill="#14110d">Seu material vira</text>
  <text x="94" y="446" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="76" font-weight="500" fill="#14110d">estudo de verdade<tspan fill="#1d4ed8">.</tspan></text>

  <!-- Subtítulo -->
  <text x="98" y="520" font-family="'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif" font-size="26" font-weight="500" fill="#5b554a">Questões, flashcards, mapas mentais e simulados — a partir do que você já tem.</text>

  <!-- Rodapé -->
  <text x="98" y="586" font-family="'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif" font-size="22" font-weight="700" fill="#14110d">papirando.com</text>
</svg>
